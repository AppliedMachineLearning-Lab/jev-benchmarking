[project]
name = "jev-benchmarking"
version = "0.1.0"
description = "Benchmarking TypeSafe's Jev (System One) model on open-source datasets"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tobias Deußer" },
    { name = "Lorenz Sparrenberg" },
    { name = "Rafet Sifa" },
]
dependencies = [
    "typesafe-sdk>=0.7",
    "datasets>=4.0",
    "numpy",
    "scipy",
    "scikit-learn",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]
paper = ["pandas", "pyarrow", "plotnine", "tol-colors"]
openmodel = ["torch", "transformers==5.14.1", "accelerate"]
sequential = ["alfworld", "rlcard>=1.2"]  # ALFWorld text games (TextWorld + PDDL); then run `alfworld-download`

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jev_benchmarking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
